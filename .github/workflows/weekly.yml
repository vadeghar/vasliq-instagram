name: Weekly token refresh and stats
on:
  schedule:
    - cron: "30 4 * * 1"   # Monday 10:00 AM IST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Refresh token
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TOKEN_OUT: ${{ runner.temp }}/token
        run: python refresh_token.py
      - name: Save new token to secret
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/token" && rm "$RUNNER_TEMP/token"
      - name: Stats
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python stats.py
      - name: Save stats
        run: |
          git config user.name "vasliq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add stats
          git diff --cached --quiet || (git commit -m "Weekly stats" && git push)
